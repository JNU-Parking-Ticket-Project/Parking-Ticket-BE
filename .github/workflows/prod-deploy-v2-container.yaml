name: 라이브 서비스 배포
on:
  workflow_call:
    secrets:
      PROD_SSH_HOST:
        required: true
      PROD_SSH_USERNAME:
        required: true
      PROD_SSH_KEY:
        required: true
      PROD_SSH_PORT:
        required: true
      SLACK_WEBHOOK_URL:
        required: true
    inputs:
      environment:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      image-name:
        required: true
        type: string
      service-name:
        required: true
        type: string

env:
  IMAGE_TAG: 'latest'
  ENVIRONMENT: ${{ inputs.environment || 'local' }}

jobs:
  deploy:
    runs-on: [ ubuntu-latest ]
    name: 서비스 배포하기
    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: GitHub 에서 레포 받아오기
        uses: actions/checkout@v3

      - name: 배포 스크립트 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            set -eu
            containers="$(sudo docker ps -qa)"
            if [ -n "$containers" ]; then
              sudo docker rm -f $containers
            fi
            sudo docker pull ${{ inputs.image-name }}:latest
            sudo docker compose up -d

            attempt=1
            while [ "$attempt" -le 60 ]; do
              if curl -fsS http://localhost:8080/api/actuator/health | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'; then
                break
              fi

              app_container="$(sudo docker ps -aq --filter "ancestor=${{ inputs.image-name }}:latest" | head -n 1)"
              if [ -n "$app_container" ]; then
                app_status="$(sudo docker inspect --format '{{.State.Status}}' "$app_container")"
                if [ "$app_status" = "exited" ] || [ "$app_status" = "dead" ]; then
                  sudo docker logs --tail 200 "$app_container"
                  exit 1
                fi
              fi

              attempt=$((attempt + 1))
              sleep 5
            done

            if [ "$attempt" -gt 60 ]; then
              sudo docker compose ps
              sudo docker compose logs --tail 200
              exit 1
            fi

            sudo docker image prune -f

      - name: Slack CICD 성공 알림
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          fields: author, workflowRun, pullRequest
          custom_payload: |
            {
              attachments: [{
                color: '#59f764',
                title: `🏃‍♂️‍➡️ 프로덕션 환경 CICD 진행 완료!`,
                fields: [
                  {
                    title: '배포 환경',
                    value: `${process.env.ENVIRONMENT}`,
                    short: true,
                  },
                  {
                    title: '배포자',
                    value: `${process.env.AS_AUTHOR}`,
                    short: true,
                  },
                  {
                    title: '워크플로 링크',
                    value: `${process.env.AS_WORKFLOW_RUN}`,
                    short: true,
                  },
                  {
                    title: 'PR 링크',
                    value: `${process.env.AS_PULL_REQUEST}`,
                    short: true,
                  }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    
      - name: Slack CICD 실패 알림
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          fields: author, workflowRun, pullRequest
          custom_payload: |
            {
              attachments: [{
                color: '#CA0025',
                title: '🧎‍♂️‍➡️ 프로덕션 환경 CICD 진행 실패!',
                fields: [
                  {
                    title: '배포 환경',
                    value: `${process.env.ENVIRONMENT}`,
                    short: true,
                  },
                  {
                    title: '배포자',
                    value: `${process.env.AS_AUTHOR}`,
                    short: true,
                  },
                  {
                    title: '워크플로 링크',
                    value: `${process.env.AS_WORKFLOW_RUN}`,
                    short: true,
                  },
                  {
                    title: 'PR 링크',
                    value: `${process.env.AS_PULL_REQUEST}`,
                    short: true,
                  }
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
