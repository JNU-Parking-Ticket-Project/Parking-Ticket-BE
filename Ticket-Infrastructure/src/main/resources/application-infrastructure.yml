spring:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        enabled: false

redis:
  stream:
    consumer:
      max-concurrency: ${REDIS_STREAM_MAX_CONCURRENCY:15}
      db-pool-reserve: ${REDIS_STREAM_DB_POOL_RESERVE:5}
      queue-capacity: ${REDIS_STREAM_QUEUE_CAPACITY:30}
      max-active-events: ${REDIS_STREAM_MAX_ACTIVE_EVENTS:4}
      batch-size: ${REDIS_STREAM_BATCH_SIZE:50}
      poll-timeout-ms: ${REDIS_STREAM_POLL_TIMEOUT_MS:500}
      pending-min-idle-ms: ${REDIS_STREAM_PENDING_MIN_IDLE_MS:30000}
      pending-claim-interval-ms: ${REDIS_STREAM_PENDING_CLAIM_INTERVAL_MS:5000}
      max-processing-failures: ${REDIS_STREAM_MAX_PROCESSING_FAILURES:3}
      drain-quiet-period-ms: ${REDIS_STREAM_DRAIN_QUIET_PERIOD_MS:5000}
      startup-drain-timeout-ms: ${REDIS_STREAM_STARTUP_DRAIN_TIMEOUT_MS:300000}

aws:
  ses:
    access-key: ${AWS_SES_ACCESS_KEY:default}
    secret-key: ${AWS_SES_SECRET_KEY:default}
    region: ${AWS_SES_REGION:ap-northeast-2}
    mail-address: ${AWS_SES_SEND_MAIL_ADDRESS:centerofjnu@jnu-parking.com}

slack:
  webhook:
    token: ${SLACK_WEBHOOK_TOKEN:}
    url: ${SLACK_WEBHOOK_URL:}
    id: ${SLACK_WEBHOOK_ID:}
    channel: ${SLACK_SERVICE_CHANNEL_ID:}
    username: ${SLACK_WEBHOOK_USERNAME:서현이의_알림요정}
